syntax = "proto3";

option csharp_namespace = "ECommerce.Shared.Protos";

package catalog;

service CatalogGrpcService {
  rpc GetItem (GetItemRequest) returns (CatalogItemResponse);
  rpc GetItems (GetItemsRequest) returns (CatalogItemsResponse);
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
}

message GetItemRequest {
  string id = 1;
}

message GetItemsRequest {
  repeated string ids = 1;
}

message CatalogItemResponse {
  string id = 1;
  string title = 2;
  string sku = 3;
  double price = 4;
  int32 stock_quantity = 5;
  bool is_active = 6;
  string category_id = 7;
}

message CatalogItemsResponse {
  repeated CatalogItemResponse items = 1;
}

message CheckStockRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool is_available = 1;
  int32 available_quantity = 2;
}
